[build-system]
requires = [
    "scikit_build_core",
    "pybind11",
    "cmake>=3.28",
    "ninja",
    "numpy",
]
build-backend = "scikit_build_core.build"

[project]
name = "torchx"
version = "1.0.2"
description = "torchx for everyone."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "einops",
    "absl-py",
    "dm-tree",
    "jax==0.4.34",
    "numpy==1.26.4",
    "rdkit==2024.3.5",
    "tqdm",
    "zstandard",
]

[tool.scikit-build]
wheel.exclude = [
    "**.pyx",
    "**/CMakeLists.txt",
    "**.cc",
    "**.h"
]

[tool.cibuildwheel]
build = "cp3*-manylinux_x86_64"
manylinux-x86_64-image = "manylinux_2_28"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[project.scripts]
build_data = "torchx.build_data:build_data"
